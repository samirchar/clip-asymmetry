[build-system]
requires = ["setuptools >= 77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "clip_ablation"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.10.15"
license = "MIT"
license-files = [
"LICENSE"
]
authors = [
    { name = "Samir Char", email = "samirchar@microsoft.com" },
    { name = "Carles Domingo-Enrich", email = "carlesd@microsoft.com" },
    { name = "Randall Balestriero", email = "randall_balestriero@brown.edu" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    #"License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]

# only the packages imported by clipablation/:
dependencies = [
  "numpy<2",
  "open_clip_torch[training]==3.1.0",
  "transformers==4.52.4",
  "python-dotenv>=1.0",
  "huggingface_hub>=0.27",
  "accelerate>=1.10.1",
  "img2dataset==1.47.0",
  "wget==3.2",
  "argparse==1.4.0",
  "wandb==0.28.1",
  "datasets==4.0.0",
  "bitsandbytes==0.47.0",
  "outlines==1.2.4",
  "expecttest~=0.3.0",
  "clip-benchmark @ git+https://github.com/samirchar/CLIP_benchmark.git@upgrades"
]

[project.optional-dependencies]
# everything else in your monorepo lives here
full = []
# Plotting stack for bin/generate_figures.py, compute_stats.py, table generators.
figures = [
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "pandas>=2.0",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "pymupdf>=1.23",
]

[project.urls]
# Homepage = ""
# Repository = ""
# Issues = ""
# HuggingFace = ""

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.flake8]
max-line-length = 120
ignore = ["E203"]